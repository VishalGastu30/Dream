# Cloudflare Workers configuration — apps/api
# See ADR-002 for the hosting decision.
# IMPORTANT: Secrets are set via `wrangler secret put`, NOT in this file.
# See .agents/rules/60-security-privacy.md for the full secrets spec.
#
# NOTE: Verify current Cloudflare recommendation (Pages vs Workers static assets)
# at project start — see docs/verified-facts.md ⚠️

name = "dream-api"
main = "src/index.ts"
compatibility_date = "2026-10-20"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "dream-db"
# Fill in after: wrangler d1 create dream-db
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "src/db/migrations"

[vars]
# Non-secret vars — safe to commit.
# Secrets (AUTH_SECRET, OWNER_GITHUB_ID, GITHUB_OAUTH_CLIENT_ID,
#          GITHUB_OAUTH_CLIENT_SECRET, GROQ_API_KEY, TURNSTILE_SECRET)
# are set via: wrangler secret put <SECRET_NAME>
ENVIRONMENT = "production"
SITE_URL = "https://vishalgastu.pages.dev"

# AI layer (Phase 7)
# Verify current free models at console.groq.com ⚠️
GROQ_MODEL = "llama-3.1-8b-instant"
ENABLE_ASK_ME = "false"
AI_DAILY_CAP = "200"
