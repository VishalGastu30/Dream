name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Only deploy after CI passes
    needs: []  # Phase 3: add `needs: [ci]` once the reusable workflow is set up
    environment:
      name: production
      url: https://your-project.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build
        env:
          SITE_URL: ${{ secrets.SITE_URL }}

      # Phase 0: Cloudflare project name is a placeholder.
      # Before first deploy:
      # 1. Create a Cloudflare Pages project (or Workers static assets project)
      # 2. Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub secrets
      # 3. Update `projectName` below to your actual project name
      # 4. Verify current Cloudflare Pages GitHub Action version at implementation time
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: dream-portfolio
          directory: apps/web/out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
