name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    name: Build & Validate
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install

      - name: Run CI Suite
        run: |
          pnpm typecheck
          pnpm lint
          pnpm validate:content
          pnpm build:career
          pnpm build
        
      # TODO: Implement Playwright Axe smoke tests, check:budget, check:assets in later phases
